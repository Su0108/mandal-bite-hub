<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mandal Bite Hub</title>
<meta name="description" content="Mandal Bite Hub – Every Bite Tells a Story. Order food, book a table, explore our restaurant."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --br:#2C1A0E;--br2:#4A2C17;--br3:#6b3e1e;
  --or:#E8682A;--or2:#F4884A;--or3:#ffb07c;
  --cr:#FFF8F0;--cr2:#FEF0DC;--cr3:#fde8c8;
  --tx:#1a0a00;--mu:#7a5a44;--wh:#fff;
  --sh:0 4px 28px rgba(44,26,14,.11);
  --sh2:0 14px 52px rgba(44,26,14,.2);
  --r:16px;--r2:24px;--tr:.2s ease;
  --nav-h:64px;
}
[data-theme="dark"]{
  --cr:#1a0f08;--cr2:#261508;--cr3:#321c0a;
  --tx:#f5e6d8;--mu:#c4a882;--wh:#2a1608;
  --sh:0 4px 28px rgba(0,0,0,.35);
  --sh2:0 14px 52px rgba(0,0,0,.5);
}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--cr);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif}
button,input,select,textarea{font-family:'Outfit',sans-serif}
img{display:block}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--br3);border-radius:3px}

/* PAGE TRANSITION */
#root{animation:pageIn .28s ease both;width:100%;overflow-x:hidden}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ANNOUNCEMENT BANNER */
.ann-banner{background:linear-gradient(90deg,var(--or),var(--or2));color:#fff;text-align:center;padding:9px 16px;font-size:.84rem;font-weight:600;position:fixed;top:0;left:0;right:0;z-index:400;display:none;align-items:center;justify-content:center;gap:10px}
.ann-banner.show{display:flex}
.ann-close{background:rgba(255,255,255,.25);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
body.has-banner{--nav-offset:38px}
body.has-banner .nav{top:38px}
body.has-banner .mmenu{top:calc(38px + 64px)}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:300;height:64px;background:rgba(44,26,14,.97);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;box-shadow:0 2px 18px rgba(0,0,0,.2);transition:top .2s}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:700;color:#fff;cursor:pointer;line-height:1;white-space:nowrap;border:none;background:none}
.logo span{color:var(--or2);font-style:italic}
.nlinks{display:flex;align-items:center;gap:2px}
.nb{background:none;border:none;color:#d9c4b0;font-size:.84rem;font-weight:500;cursor:pointer;padding:7px 11px;border-radius:8px;transition:all var(--tr);white-space:nowrap}
.nb:hover,.nb.on{color:#fff;background:rgba(232,104,42,.22)}
.ncart{background:var(--or)!important;color:#fff!important;padding:7px 14px!important;border-radius:10px!important;position:relative;font-weight:600!important}
.ncart:hover{background:#c9561e!important}
.cbadge{position:absolute;top:-7px;right:-7px;width:18px;height:18px;background:#fff;color:var(--or);border-radius:50%;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--or)}
.dm-btn{background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background var(--tr)}
.dm-btn:hover{background:rgba(255,255,255,.22)}
.burger{display:none;background:none;border:none;color:#fff;cursor:pointer;font-size:1.4rem;padding:5px}
.mmenu{display:none;flex-direction:column;gap:3px;position:fixed;top:64px;inset:auto 0;background:var(--br);z-index:299;padding:12px;border-bottom:1px solid rgba(255,255,255,.08);max-height:calc(100vh - 64px);overflow-y:auto}
.mmenu.open{display:flex}
.mmenu .nb{text-align:left;padding:11px 14px;font-size:.95rem;color:#d9c4b0}
@media(max-width:820px){.nlinks{display:none}.burger{display:block}}

/* BOTTOM NAV (mobile) */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:298;background:var(--wh);border-top:1px solid var(--cr2);padding:6px 0 8px;box-shadow:0 -4px 20px rgba(0,0,0,.12)}
.bnav-inner{display:flex;justify-content:space-around;align-items:center}
.bnav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:10px;transition:all var(--tr);color:var(--mu);min-width:52px}
.bnav-btn:hover,.bnav-btn.on{color:var(--or)}
.bnav-btn .bi{font-size:1.35rem}
.bnav-btn .bl{font-size:.65rem;font-weight:600}
.bnav-cart-pos{position:relative}
.bnav-badge{position:absolute;top:-3px;right:2px;background:var(--or);color:#fff;border-radius:50%;width:16px;height:16px;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center}
@media(max-width:820px){.bnav{display:block}body{padding-bottom:70px}}

/* HERO */
.hero{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center}
.hbg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1600&q=90') center/cover no-repeat}
.hov{position:absolute;inset:0;background:linear-gradient(135deg,rgba(20,8,0,.92) 0%,rgba(44,26,14,.72) 60%,rgba(74,44,23,.5) 100%)}
.hcon{position:relative;z-index:2;text-align:center;padding:100px 5vw 40px;max-width:760px}
.hbadge{display:inline-flex;align-items:center;gap:8px;background:rgba(232,104,42,.18);border:1px solid rgba(232,104,42,.42);color:var(--or2);padding:7px 20px;border-radius:30px;font-size:.8rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:22px;animation:fu .6s .1s both}
.hero h1{font-size:clamp(2.5rem,6.5vw,4.2rem);color:#fff;line-height:1.12;margin-bottom:16px;text-shadow:0 3px 24px rgba(0,0,0,.5);animation:fu .7s .2s both}
.hero h1 em{color:var(--or2);font-style:italic}
.hsub{color:#ddd0c4;font-size:clamp(.97rem,2vw,1.15rem);line-height:1.78;margin:0 auto 36px;font-weight:300;animation:fu .7s .3s both;max-width:520px}
.hbtns{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;animation:fu .7s .4s both}

/* BUTTONS */
.bp{background:var(--or);color:#fff;border:none;padding:13px 30px;border-radius:50px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all var(--tr);box-shadow:0 4px 20px rgba(232,104,42,.38);display:inline-flex;align-items:center;gap:7px}
.bp:hover{background:#c9561e;transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,104,42,.48)}
.bo{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);padding:12px 30px;border-radius:50px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all var(--tr);display:inline-flex;align-items:center;gap:7px}
.bo:hover{background:rgba(255,255,255,.1);border-color:#fff;transform:translateY(-2px)}
.bbr{background:var(--br);color:#fff;border:none;padding:12px 26px;border-radius:11px;font-size:.93rem;font-weight:600;cursor:pointer;transition:all var(--tr)}
.bbr:hover{background:#1a0a00}
.bfull{width:100%;padding:14px;border-radius:12px;font-size:.97rem;font-weight:700;justify-content:center;display:flex;align-items:center;gap:8px}
.bsm{padding:8px 16px;border-radius:9px;font-size:.84rem;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px}

/* SECTIONS */
.sec{padding:64px 5vw}
.sec:last-of-type{padding-bottom:48px}
.seca{background:var(--cr2)}
.shd{text-align:center;margin-bottom:50px}
.shd h2{font-size:clamp(1.85rem,4vw,2.6rem);color:var(--br);margin-bottom:9px}
[data-theme="dark"] .shd h2{color:var(--or2)}
.shd p{color:var(--mu);font-size:.99rem;max-width:500px;margin:14px auto 0;line-height:1.75;font-weight:300}
.divl{width:54px;height:4px;background:linear-gradient(90deg,var(--or),var(--or3));border-radius:2px;margin:13px auto 0}
.card{background:var(--wh);border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden;transition:transform var(--tr),box-shadow var(--tr)}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.cp{padding:20px 22px}

/* TODAY'S SPECIAL */
.special-banner{background:linear-gradient(135deg,var(--br) 0%,#3d2010 100%);border-radius:var(--r2);padding:28px 32px;display:flex;align-items:center;gap:28px;box-shadow:var(--sh2);position:relative;overflow:hidden;margin-bottom:0}
.special-banner::before{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=800&q=80') center/cover no-repeat;opacity:.18}
.special-badge{background:var(--or);color:#fff;font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;display:inline-block;margin-bottom:8px}
.special-content{position:relative;z-index:1;flex:1}
.special-content h3{font-size:1.8rem;color:#fff;margin-bottom:6px}
.special-content p{color:#e8d5c0;font-size:.92rem;margin-bottom:14px;font-weight:300;line-height:1.6}
.special-img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.3);flex-shrink:0;position:relative;z-index:1}
@media(max-width:600px){.special-banner{flex-direction:column;text-align:center}.special-img{width:100px;height:100px}}

/* WELCOME */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.wimg{border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh2);aspect-ratio:4/3}
.wimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.wimg:hover img{transform:scale(1.04)}
.wtxt h2{font-size:clamp(1.65rem,3.2vw,2.2rem);color:var(--br);margin-bottom:13px}
[data-theme="dark"] .wtxt h2{color:var(--or2)}
.wtxt p{color:var(--mu);line-height:1.82;font-size:.99rem;margin-bottom:15px;font-weight:300}
.facs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.fac{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--br2);font-weight:500}
[data-theme="dark"] .fac{color:var(--mu)}
.fico{width:36px;height:36px;background:rgba(232,104,42,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
@media(max-width:768px){.wgrid{grid-template-columns:1fr}}

/* REVIEWS */
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.review-card{padding:22px;position:relative}
.rev-stars{color:#f59e0b;font-size:1.1rem;margin-bottom:10px;letter-spacing:2px}
.rev-text{color:var(--mu);font-size:.9rem;line-height:1.7;font-style:italic;margin-bottom:14px;font-weight:300}
.rev-author{display:flex;align-items:center;gap:10px}
.rev-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.95rem;flex-shrink:0}
.rev-name{font-weight:600;color:var(--br);font-size:.88rem}
[data-theme="dark"] .rev-name{color:var(--or2)}
.rev-date{font-size:.75rem;color:var(--mu)}

/* OFFERS */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.oimg{aspect-ratio:16/9;overflow:hidden}
.oimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .oimg img{transform:scale(1.07)}
.obadge{background:rgba(232,104,42,.12);color:var(--or);font-size:.74rem;font-weight:700;padding:3px 11px;border-radius:20px;display:inline-block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}

/* GALLERY */
.pg-hd{padding:106px 5vw 40px;background:linear-gradient(135deg,var(--br) 0%,var(--br2) 100%);text-align:center}
.pg-hd h1{color:#fff;font-size:clamp(1.85rem,4.5vw,2.8rem);margin-bottom:8px}
.pg-hd p{color:#d9c4b0;font-size:.99rem;font-weight:300}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gallery-item{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;cursor:pointer;position:relative}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gallery-item:hover img{transform:scale(1.07)}
.g-overlay{position:absolute;inset:0;background:rgba(44,26,14,0);transition:background .3s;display:flex;align-items:center;justify-content:center}
.gallery-item:hover .g-overlay{background:rgba(44,26,14,.35)}
.g-overlay span{color:#fff;font-size:2rem;opacity:0;transition:opacity .3s}
.gallery-item:hover .g-overlay span{opacity:1}
.lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lb-img{max-width:90vw;max-height:85vh;border-radius:12px;object-fit:contain;box-shadow:0 8px 48px rgba(0,0,0,.6)}
.lb-close{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:1.6rem;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;font-size:1.5rem;width:50px;height:50px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-caption{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:.9rem;background:rgba(0,0,0,.5);padding:6px 18px;border-radius:20px;white-space:nowrap}

/* MENU */
.mctrl{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
.sbar{position:relative;max-width:420px}
.sbar input{width:100%;padding:11px 13px 11px 42px;border:2px solid var(--cr3);border-radius:11px;font-size:.95rem;color:var(--tx);background:var(--wh);outline:none;transition:border-color var(--tr)}
.sbar input:focus{border-color:var(--or)}
.sico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flbl{font-size:.78rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-right:2px;white-space:nowrap}
.fb{background:var(--wh);border:2px solid var(--cr3);color:var(--br2);padding:7px 14px;border-radius:50px;font-size:.83rem;font-weight:500;cursor:pointer;transition:all var(--tr);display:flex;align-items:center;gap:5px}
.fb:hover,.fb.on{background:var(--or);border-color:var(--or);color:#fff}
.fb.von{background:#2ecc71;border-color:#2ecc71;color:#fff}
.fb.nvon{background:#e74c3c;border-color:#e74c3c;color:#fff}
.cat-count{background:rgba(255,255,255,.3);border-radius:10px;padding:1px 6px;font-size:.72rem;font-weight:700}
.fb:not(.on):not(.von):not(.nvon) .cat-count{background:var(--cr2);color:var(--mu)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.fimg{aspect-ratio:4/3;overflow:hidden;position:relative}
.fimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s;cursor:zoom-in}
.card:hover .fimg img{transform:scale(1.07)}
.vdot{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:5px;border:2.5px solid;background:#fff;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900}
.vdot.v{border-color:#2ecc71;color:#2ecc71}
.vdot.nv{border-color:#e74c3c;color:#e74c3c}
/* Item badges */
.item-badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}
.ibadge{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;display:inline-block}
.ibadge.bestseller{background:#f59e0b;color:#fff}
.ibadge.new{background:#3b82f6;color:#fff}
.ibadge.spicy{background:#ef4444;color:#fff}
.ibadge.special{background:var(--or);color:#fff}
/* Sold out overlay */
.sold-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.sold-overlay span{background:rgba(255,255,255,.9);color:#333;font-weight:700;font-size:.88rem;padding:6px 16px;border-radius:20px}
.fbody{padding:14px 17px 17px}
.fbody h3{font-size:1.03rem;color:var(--br);margin-bottom:4px}
[data-theme="dark"] .fbody h3{color:var(--or2)}
.fbody p{color:var(--mu);font-size:.83rem;line-height:1.52;margin-bottom:12px;font-weight:300}
.ffoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fprice{font-size:1.18rem;font-weight:700;color:var(--or);font-family:'Cormorant Garamond',serif;white-space:nowrap}
/* Order now + qty controls */
.item-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.order-now-btn{background:var(--or);color:#fff;border:none;padding:7px 14px;border-radius:9px;font-size:.8rem;font-weight:700;cursor:pointer;transition:background var(--tr);white-space:nowrap}
.order-now-btn:hover{background:#c9561e}
.qctl{display:flex;align-items:center;gap:6px}
.qb{width:28px;height:28px;border-radius:7px;border:none;background:var(--or);color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:background var(--tr)}
.qb:hover{background:#c9561e}
.qn{font-weight:700;color:var(--br);min-width:17px;text-align:center;font-size:.93rem}
[data-theme="dark"] .qn{color:var(--or2)}

/* STICKY CART BAR */
.sticky-cart{position:fixed;bottom:0;left:0;right:0;z-index:290;background:var(--br);color:#fff;padding:14px 5vw;display:none;align-items:center;justify-content:space-between;box-shadow:0 -4px 24px rgba(0,0,0,.3);transition:transform .3s}
.sticky-cart.show{display:flex}
@media(max-width:820px){.sticky-cart{bottom:64px}}
.sc-info{font-size:.9rem;font-weight:500;color:#e8d5c0}
.sc-info strong{color:#fff;font-size:1.05rem}
.sc-btn{background:var(--or);color:#fff;border:none;padding:10px 22px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background var(--tr)}
.sc-btn:hover{background:#c9561e}

/* CART DRAWER */
.cart-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;backdrop-filter:blur(3px)}
.cart-backdrop.open{display:block}
.cart-drawer{position:fixed;top:0;right:-420px;width:400px;max-width:95vw;height:100vh;background:var(--wh);z-index:501;box-shadow:-8px 0 40px rgba(0,0,0,.18);transition:right .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.cart-drawer.open{right:0}
.cart-head{background:var(--br);color:#fff;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cart-head h3{font-size:1.2rem;font-family:'Cormorant Garamond',serif}
.cart-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.cart-body{flex:1;overflow-y:auto;padding:16px}
.cart-empty{text-align:center;padding:60px 20px;color:var(--mu)}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--cr2)}
.cart-item:last-child{border-bottom:none}
.ci-img{width:60px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.92rem;font-weight:600;color:var(--br);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme="dark"] .ci-name{color:var(--or2)}
.ci-price{font-size:.84rem;color:var(--or);font-weight:600}
.cart-foot{padding:16px;border-top:2px solid var(--cr2);flex-shrink:0;background:var(--wh)}

];

// ─── STATE ────────────────────────────────────────────────────────────────────
let S={
  page:'home',cart:[],
  menu:JSON.parse(JSON.stringify(INIT_MENU)),
  orders:[],reservations:[],
  wifi:Object.assign({},INIT_WIFI),
  offers:JSON.parse(JSON.stringify(INIT_OFFERS)),
  special:Object.assign({},INIT_SPECIAL),
  announcement:Object.assign({},INIT_ANN),
  coupons:JSON.parse(JSON.stringify(INIT_COUPONS)),
  pendOrd:null,curOid:null,
  adminIn:false,adminTab:'dashboard',adminSB:false,
  mobMenu:false,
  menuSearch:'',menuCat:'All',menuVeg:'all',
  couponCode:'',couponApplied:null,
  darkMode:false
};

// ─── COUPON HELPER ────────────────────────────────────────────────────────────
function getCouponMap(){const m={};S.coupons.filter(c=>c.active).forEach(c=>{m[c.code]=c;});return m;}

// ─── UTILS ────────────────────────────────────────────────────────────────────
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');
const gst=n=>Math.round(n*0.05);
const grand=n=>n+gst(n);
const cartSub=()=>S.cart.reduce((s,i)=>s+i.price*i.qty,0);
const cartCount=()=>S.cart.reduce((s,i)=>s+i.qty,0);
const el=id=>document.getElementById(id);

function toast(msg,type=''){
  const d=document.createElement('div');
  d.className='toast'+(type?' '+type:'');d.textContent=msg;
  el('toast-area').appendChild(d);
  setTimeout(()=>d.remove(),3200);
}

function go(page){
  S.page=page;S.mobMenu=false;
  window.scrollTo(0,0);render();
}

function toggleDark(){
  S.darkMode=!S.darkMode;
  document.documentElement.setAttribute('data-theme',S.darkMode?'dark':'light');
  render();
}

// ─── ANNOUNCEMENT ─────────────────────────────────────────────────────────────
function showAnn(){
  const b=el('ann-banner');const t=el('ann-text');
  if(!b||!t)return;
  if(S.announcement.show&&S.announcement.text){
    t.textContent=S.announcement.text;
    b.classList.add('show');
    document.body.classList.add('has-banner');
  } else {
    b.classList.remove('show');
    document.body.classList.remove('has-banner');
  }
}
function closeAnn(){S.announcement.show=false;showAnn();}

// ─── CART ─────────────────────────────────────────────────────────────────────
function openCart(){el('cart-drawer').classList.add('open');el('cart-backdrop').classList.add('open');renderCart();}
function closeCart(){el('cart-drawer').classList.remove('open');el('cart-backdrop').classList.remove('open');}

function addToCart(id){
  const item=S.menu.find(m=>m.id===id);
  if(!item||item.soldOut)return;
  const ex=S.cart.find(c=>c.id===id);
  if(ex)ex.qty++;else S.cart.push({...item,qty:1});
  toast(item.name+' added! 🛒');
  renderNavBadge();renderBNav();renderStickyCart();
  if(el('cart-drawer').classList.contains('open'))renderCart();
  renderMenuGrid();
}

function updQty(id,d){
  const idx=S.cart.findIndex(c=>c.id===id);
  if(idx<0)return;
  S.cart[idx].qty+=d;
  if(S.cart[idx].qty<=0)S.cart.splice(idx,1);
  renderNavBadge();renderBNav();renderStickyCart();
  renderCart();renderMenuGrid();
}

function renderNavBadge(){
  const c=cartCount();
  document.querySelectorAll('.cbadge,.bnav-badge').forEach(b=>{
    b.textContent=c;b.style.display=c>0?'flex':'none';
  });
}

function renderBNav(){
  const c=cartCount();
  const bb=el('bnav-badge-el');
  if(bb){bb.textContent=c;bb.style.display=c>0?'flex':'none';}
}

function renderStickyCart(){
  const sc=el('sticky-cart-bar');
  if(!sc)return;
  const c=cartCount(),sub=cartSub();
  if(c>0&&(S.page==='menu'||S.page==='home')){
    sc.classList.add('show');
    sc.innerHTML=`<div class="sc-info">${c} item${c>1?'s':''} &nbsp;|&nbsp; <strong>${fmt(grand(sub))}</strong></div>
    <button class="sc-btn" onclick="openCart()">🛒 View Cart</button>`;
  } else {
    sc.classList.remove('show');
  }
}

function renderCart(){
  const body=el('cart-body');const foot=el('cart-foot');
  if(!body||!foot)return;
  if(S.cart.length===0){
    body.innerHTML=`<div class="cart-empty"><div style="font-size:3rem;margin-bottom:12px">🛒</div><p>Your cart is empty</p><button class="bp" style="margin:14px auto 0;display:inline-flex" onclick="closeCart();go('menu')">Browse Menu</button></div>`;
    foot.innerHTML='';return;
  }
  body.innerHTML=S.cart.map(i=>`
    <div class="cart-item">
      <img class="ci-img" src="${i.img}" alt="${i.name}" onerror="this.style.display='none'"/>
      <div class="ci-info"><div class="ci-name">${i.name}</div><div class="ci-price">${fmt(i.price)} × ${i.qty} = ${fmt(i.price*i.qty)}</div></div>
      <div class="qctl">
        <button class="qb" onclick="updQty(${i.id},-1)">−</button>
        <span class="qn">${i.qty}</span>
        <button class="qb" onclick="updQty(${i.id},1)">+</button>
      </div>
    </div>`).join('');
  const sub=cartSub();
  let disc=0;
  if(S.couponApplied){
    const cp=getCouponMap()[S.couponApplied];
    disc=cp.type==='percent'?Math.round(sub*cp.disc/100):Math.min(cp.disc,sub);
  }
  const discSub=sub-disc;
  const g=gst(discSub);const tot=grand(discSub);
  foot.innerHTML=`
    <div class="cart-sum-row"><span>Subtotal</span><span>${fmt(sub)}</span></div>
    ${disc>0?`<div class="cart-sum-row" style="color:#2ecc71"><span>🎉 Coupon (${S.couponApplied})</span><span>−${fmt(disc)}</span></div>`:''}
    <div class="cart-sum-row"><span>GST (5%)</span><span>${fmt(g)}</span></div>
    <div class="cart-sum-tot"><span>Total</span><span>${fmt(tot)}</span></div>
    <div class="coupon-row">
      <input id="coupon-inp" placeholder="Enter coupon code" value="${S.couponCode}" oninput="S.couponCode=this.value.toUpperCase();this.value=S.couponCode"/>
      <button onclick="applyCoupon()">Apply</button>
    </div>
    <div id="coupon-msg"></div>
    <button class="bp bfull" style="margin-top:12px" onclick="closeCart();go('order')">Proceed to Order →</button>`;
  if(S.couponApplied){
    const m=el('coupon-msg');
    if(m)m.innerHTML=`<div class="coupon-msg coupon-ok">✅ ${getCouponMap()[S.couponApplied].desc} applied!</div>`;
  }
}

function applyCoupon(){
  const code=S.couponCode.trim().toUpperCase();
  if(!code){toast('Enter a coupon code','err');return;}
  if(getCouponMap()[code]){
    S.couponApplied=code;
    toast('Coupon applied! 🎉','ok');
    renderCart();
  } else {
    S.couponApplied=null;
    const m=el('coupon-msg');
    if(m)m.innerHTML=`<div class="coupon-msg coupon-err">❌ Invalid coupon code</div>`;
  }
}

// ─── LIGHTBOX ─────────────────────────────────────────────────────────────────
let lbIdx=0;
function openLB(idx){lbIdx=idx;setLB();}
function setLB(){el('lightbox').classList.add('open');el('lb-img').src=GALLERY[lbIdx].src;el('lb-cap').textContent=GALLERY[lbIdx].cap;}
function closeLB(){el('lightbox').classList.remove('open');}
function lbNav(d){lbIdx=(lbIdx+d+GALLERY.length)%GALLERY.length;setLB();}
document.addEventListener('keydown',e=>{
  if(!el('lightbox').classList.contains('open'))return;
  if(e.key==='ArrowLeft')lbNav(-1);if(e.key==='ArrowRight')lbNav(1);if(e.key==='Escape')closeLB();
});

// ─── MENU CARD BUILDER ────────────────────────────────────────────────────────
function buildMenuCard(item,showOrderNow=true){
  const ci=S.cart.find(c=>c.id===item.id);
  const badges=item.badge?`<div class="item-badges"><span class="ibadge ${item.badge}">${item.badge==='bestseller'?'⭐ Bestseller':item.badge==='new'?'🆕 New':item.badge==='spicy'?'🌶️ Spicy':item.badge==='special'?'✨ Special':''}</span></div>`:'';
  const soldOverlay=item.soldOut?'<div class="sold-overlay"><span>❌ Sold Out Today</span></div>':'';
  let actions='';
  if(item.soldOut){
    actions=`<button class="order-now-btn" style="background:#ccc;cursor:not-allowed" disabled>Unavailable</button>`;
  } else if(!ci){
    actions=`<div class="item-actions">
      <button class="order-now-btn" onclick="addToCart(${item.id})">🛒 Order Now</button>
    </div>`;
  } else {
    actions=`<div class="item-actions">
      <div class="qctl"><button class="qb" onclick="updQty(${item.id},-1)">−</button><span class="qn">${ci.qty}</span><button class="qb" onclick="updQty(${item.id},1)">+</button></div>
      ${showOrderNow?`<button class="order-now-btn" onclick="addToCart(${item.id})">+ Add More</button>`:''}
    </div>`;
  }
  return `<div class="card">
    <div class="fimg">
      <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'" onclick="openLB(0)"/>
      ${badges}${soldOverlay}
      <div class="vdot ${item.veg?'v':'nv'}">●</div>
    </div>
    <div class="fbody">
      <h3>${item.name}</h3><p>${item.desc}</p>
      <div class="ffoot"><span class="fprice">${fmt(item.price)}</span>${actions}</div>
    </div></div>`;
}

function renderMenuGrid(){
  const c=el('menu-grid-container');if(!c)return;
  const cats=['All','Starter','Main Course','Dessert','Drinks'];
  const filtered=S.menu.filter(i=>{
    const mc=S.menuCat==='All'||i.cat===S.menuCat;
    const mv=S.menuVeg==='all'||(S.menuVeg==='veg'?i.veg:!i.veg);
    const ms=!S.menuSearch||i.name.toLowerCase().includes(S.menuSearch.toLowerCase())||i.desc.toLowerCase().includes(S.menuSearch.toLowerCase());
    return mc&&mv&&ms;
  });

  const sub=cartSub();const discSub=sub-disc;
  const oid='ORD'+Date.now().toString().slice(-6);
  const now=Date.now();
  const ord={id:oid,items:[...S.cart],total:discSub,subtotal:sub,discount:disc,coupon:S.couponApplied||'',customer:{name,phone,type:otype,notes},status:'Pending',at:new Date(now).toLocaleString('en-IN'),placedAt:now};

function copyUPI(){
  const txt=R.upi;const btn=el('copy-upi-btn');

  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok).catch(()=>{legacyCopy(txt);ok();});}
  else{legacyCopy(txt);ok();}
}
function legacyCopy(txt){const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);}

// ─── ORDER STATUS – PHONE LOOKUP SYSTEM ──────────────────────────────────────
// Orders visible for 1 hour from placedAt timestamp
const ORDER_VISIBLE_MS = 60 * 60 * 1000; // 1 hour

function orderIsVisible(order){
  if(!order.placedAt) return true; // legacy orders always visible
  return (Date.now() - order.placedAt) < ORDER_VISIBLE_MS;
}

function getOrdersByPhone(phone){
  const now = Date.now();
  return S.orders.filter(o =>
    o.customer.phone === phone &&
    (now - (o.placedAt || now)) < ORDER_VISIBLE_MS
  ).sort((a,b)=>(b.placedAt||0)-(a.placedAt||0));
}

function lookupOrders(){
  const phone = (el('track-phone')?.value||'').trim();
  const results = el('track-results');
  if(!results) return;
  if(!/^\d{10}$/.test(phone)){
    results.innerHTML=`<div style="text-align:center;padding:28px;background:var(--wh);border-radius:var(--r2);box-shadow:var(--sh)">
      <div style="font-size:2.2rem;margin-bottom:10px">⚠️</div>
      <p style="color:var(--mu)">Please enter a valid 10-digit phone number.</p>
    </div>`;
    return;
  }
  const orders = getOrdersByPhone(phone);
  if(orders.length===0){
    results.innerHTML=`<div style="text-align:center;padding:36px;background:var(--wh);border-radius:var(--r2);box-shadow:var(--sh)">
      <div style="font-size:2.8rem;margin-bottom:12px">🔎</div>
      <h3 style="color:var(--br);margin-bottom:8px">No Active Orders Found</h3>
      <p style="color:var(--mu);font-size:.9rem;line-height:1.7">No orders found for <strong>${phone}</strong> in the last hour.<br/>Either your order has expired or the number is different.</p>
      <button class="bp" style="margin-top:18px" onclick="go('menu')">Order Food →</button>
    </div>`;
    return;
  }
  results.innerHTML = orders.map(o => buildOrderCard(o)).join('');
}

function buildOrderCard(order){
  const stages = ['Pending','Preparing','Served','Completed'];
  const stageIcons = ['📋','🍳','🍽️','✅'];
  const idx = Math.max(stages.indexOf(order.status), 0);
  const isCompleted = order.status === 'Completed';
  const tot = grand(order.total);
  const placedTime = order.placedAt ? new Date(order.placedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '—';
  const expiresIn = order.placedAt ? Math.max(0, Math.round((ORDER_VISIBLE_MS-(Date.now()-order.placedAt))/60000)) : 60;

  const msgs = {
    Pending:   '⏳ Order received! We will start preparing it shortly.',
    Preparing: '🍳 Your order is being freshly prepared. Thank you for your patience!',
    Served:    '🍽️ Your order has been served. Enjoy your meal!',
    Completed: '✅ Payment received. Thank you for dining with us!'
  };

  // Stage tracker (4 stages for customer view)
  const trackerHTML = stages.map((s,i)=>`
    <div class="stg">
      <div class="sdot ${i<idx?'dn':i===idx?'cu':''}">${i<idx?'✓':stageIcons[i]}</div>
      <span class="slb ${i<=idx?'on':''}" style="font-size:.7rem">${s}</span>
    </div>
    ${i<stages.length-1?`<div class="sln ${i<idx?'dn':''}"></div>`:''}`
  ).join('');

  // Bill section — only show when Completed
  const billHTML = isCompleted ? `
    <div style="margin-top:20px;border:2px solid var(--or);border-radius:14px;overflow:hidden">
      <!-- Bill Header -->
      <div style="background:var(--br);color:#fff;padding:14px 18px;text-align:center">
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;margin-bottom:2px">🍴 Mandal Bite Hub</div>
        <div style="font-size:.75rem;color:#c9a98a">${R.address}</div>
        <div style="font-size:.75rem;color:#c9a98a;margin-top:2px">${R.phoneDisplay} | ${R.email}</div>
      </div>
      <!-- Bill Details -->
      <div style="padding:16px 18px;background:var(--wh)">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:.82rem;color:var(--mu)">
          <span>Bill No: <strong style="color:var(--br)">#${order.id}</strong></span>
          <span>Time: <strong style="color:var(--br)">${placedTime}</strong></span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:14px;font-size:.82rem;color:var(--mu)">
          <span>Customer: <strong style="color:var(--br)">${order.customer.name}</strong></span>
          <span>Table: <strong style="color:var(--br);text-transform:capitalize">${order.customer.type}</strong></span>
        </div>
        <div style="border-top:1px dashed var(--cr3);padding-top:12px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:var(--mu);padding-bottom:6px">
            <span>ITEM</span><span>QTY × PRICE</span><span>AMOUNT</span>
          </div>
          ${order.items.map(i=>`
            <div style="display:flex;justify-content:space-between;font-size:.84rem;color:var(--tx);padding:4px 0;border-bottom:1px solid var(--cr2)">
              <span style="flex:2">${i.name}</span>
              <span style="flex:1;text-align:center;color:var(--mu)">${i.qty} × ${fmt(i.price)}</span>
              <span style="flex:1;text-align:right;font-weight:600">${fmt(i.price*i.qty)}</span>
            </div>`).join('')}
        </div>
        <div style="border-top:1px solid var(--cr2);padding-top:10px">
          <div style="display:flex;justify-content:space-between;font-size:.88rem;color:var(--mu);padding:3px 0">
            <span>Subtotal</span><span>${fmt(order.subtotal||order.total)}</span>
          </div>
          ${(order.discount||0)>0?`<div style="display:flex;justify-content:space-between;font-size:.88rem;color:#2ecc71;padding:3px 0"><span>Discount (${order.coupon})</span><span>−${fmt(order.discount)}</span></div>`:''}
          <div style="display:flex;justify-content:space-between;font-size:.88rem;color:var(--mu);padding:3px 0">
            <span>GST @ 5%</span><span>${fmt(gst(order.total))}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;color:var(--br);border-top:2px solid var(--br);margin-top:8px;padding-top:10px">
            <span>TOTAL PAID</span><span style="color:var(--or)">${fmt(tot)}</span>
          </div>
        </div>
        <div style="text-align:center;margin-top:16px;padding-top:12px;border-top:1px dashed var(--cr3)">
          <div style="font-size:.8rem;color:var(--mu)">Payment via UPI • ${R.upi}</div>
          <div style="font-size:.85rem;font-weight:600;color:var(--br);margin-top:6px">Thank you for visiting Mandal Bite Hub! 🙏</div>
          <div style="font-size:.75rem;color:var(--mu);margin-top:3px">Come back soon — Every Bite Tells a Story</div>
        </div>
      </div>
      <!-- Print Bill Button -->
      <div style="padding:12px 18px;background:var(--cr2);text-align:center">
        <button onclick="printBill('${order.id}')" style="background:var(--br);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px">
          🖨️ Print / Save Bill
        </button>
      </div>
    </div>` : '';

  // Expiry countdown
  const expiryHTML = !isCompleted ? `
    <div style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mu);justify-content:center;margin-top:14px">
      <span>⏱</span><span>Order visible for ~${expiresIn} more min${expiresIn!==1?'s':''}</span>
    </div>` : '';

  return `
  <div class="stcard" style="margin-bottom:20px;text-align:left">
    <!-- Order header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div>
        <div class="oidb" style="margin-bottom:4px">#${order.id}</div>
        <div style="font-size:.8rem;color:var(--mu)">Placed at ${placedTime}</div>
      </div>
      <div style="text-align:right">
        <span class="pill ${isCompleted?'pcomp':idx===1?'pprep':idx===2?'pserv':'ppend'}" style="font-size:.82rem;padding:5px 14px">${order.status}</span>
      </div>
    </div>

    <!-- Status message -->
    <div style="background:${isCompleted?'rgba(46,204,113,.08)':'rgba(232,104,42,.07)'};border-left:4px solid ${isCompleted?'#2ecc71':'var(--or)'};border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:18px">
      <p style="color:var(--tx);font-size:.9rem;font-weight:500">${msgs[order.status]||msgs['Pending']}</p>
    </div>

    <!-- Stage tracker -->
    <div class="stgs" style="margin:0 0 18px 0">${trackerHTML}</div>

    <!-- Order summary -->
    <div class="oig" style="margin-bottom:0">
      <div class="oi"><span>Customer</span><strong>${order.customer.name}</strong></div>
      <div class="oi"><span>Phone</span><strong>${order.customer.phone}</strong></div>
      <div class="oi"><span>Order Type</span><strong style="text-transform:capitalize">${order.customer.type}</strong></div>
      <div class="oi"><span>Total</span><strong class="ort">${fmt(tot)}</strong></div>
    </div>

    <!-- Items list (compact) -->
    <div style="background:var(--cr);border-radius:10px;padding:12px 14px;margin-top:12px">
      <div style="font-weight:700;color:var(--br);font-size:.82rem;margin-bottom:7px">🛍️ Items Ordered</div>
      ${order.items.map(i=>`<div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);padding:3px 0"><span>${i.name} ×${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('')}
      <div style="display:flex;justify-content:space-between;font-weight:700;color:var(--br);border-top:1px solid var(--cr2);margin-top:6px;padding-top:6px;font-size:.9rem">
        <span>Total Payable</span><span style="color:var(--or)">${fmt(tot)}</span>
      </div>
    </div>

    ${billHTML}
    ${expiryHTML}

    <button class="bp" style="margin-top:16px;width:100%;justify-content:center" onclick="go('menu')">🍽️ Order More</button>
  </div>`;
}

function adminDash(revenue,pendCt){
  // Revenue chart
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayRevs=[0,0,0,0,0,0,0];
  S.orders.filter(o=>o.status==='Completed').forEach(o=>{ const d=new Date(o.at).getDay();if(d>=0)dayRevs[(d+6)%7]+=grand(o.total); });
  const maxRev=Math.max(...dayRevs,1);
  const chartBars=days.map((d,i)=>`<div class="chart-bar-wrap"><div class="chart-bar" data-val="${fmt(dayRevs[i])}" style="height:${Math.round((dayRevs[i]/maxRev)*100)}px"></div><div class="chart-label">${d}</div></div>`).join('');
  return `<div class="stats">
    <div class="stat"><div class="stn">${S.orders.length}</div><div class="stl">Total Orders</div></div>
    <div class="stat"><div class="stn">${S.reservations.length}</div><div class="stl">Reservations</div></div>
    <div class="stat"><div class="stn">${pendCt}</div><div class="stl">Pending Orders</div></div>
    <div class="stat"><div class="stn" style="color:var(--or)">${fmt(revenue)}</div><div class="stl">Revenue (Completed)</div></div>
  </div>
  <div class="rev-chart"><h3>📊 Weekly Revenue</h3><div class="chart-bars">${chartBars}</div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="box">
      <h2 style="font-size:1rem;margin-bottom:13px">Recent Orders</h2>
      ${S.orders.length===0?'<p style="color:var(--mu);text-align:center;padding:18px 0;font-size:.9rem">No orders yet</p>':
        S.orders.slice(0,6).map(o=>`<div style="display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--cr2);font-size:.83rem;flex-wrap:wrap;align-items:center"><span style="font-weight:700;color:var(--or)">#${o.id}</span><span style="color:var(--br2);font-weight:500">${o.customer.name}</span><span style="color:var(--or);font-weight:700">${fmt(grand(o.total))}</span><span class="pill p${o.status.toLowerCase()}">${o.status}</span></div>`).join('')}
    </div>
    <div class="box">
      <h2 style="font-size:1rem;margin-bottom:13px">Revenue Breakdown</h2>
      ${S.orders.filter(o=>o.status==='Completed').length===0?'<p style="color:var(--mu);text-align:center;padding:18px 0;font-size:.9rem">No completed orders yet</p>':
        S.orders.filter(o=>o.status==='Completed').map(o=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--cr2);font-size:.85rem"><span style="color:var(--mu)">Order #${o.id}</span><span style="font-weight:700;color:var(--or)">${fmt(grand(o.total))}</span></div>`).join('')+
        `<div style="display:flex;justify-content:space-between;padding:9px 0;font-weight:700;color:var(--br);border-top:2px solid var(--cr2);margin-top:5px"><span>Total Revenue</span><span class="ort">${fmt(revenue)}</span></div>`}

}

function showCouponForm(code){
  const b=el('coupon-form-box');if(b)b.style.display='block';
  if(!code){
    el('coupon-form-title').textContent='➕ Add New Coupon';
    el('cp-code').value='';el('cp-type').value='percent';el('cp-disc').value='';
    el('cp-desc').value='';el('cp-active').value='true';el('cp-editcode').value='';
    el('cp-code').disabled=false;
    return;
  }
  const cp=S.coupons.find(c=>c.code===code);if(!cp)return;
  el('coupon-form-title').textContent='✏️ Edit Coupon';
  el('cp-code').value=cp.code;el('cp-code').disabled=true;
  el('cp-type').value=cp.type;el('cp-disc').value=cp.disc;
  el('cp-desc').value=cp.desc;el('cp-active').value=String(cp.active);
  el('cp-editcode').value=cp.code;
  window.scrollTo(0,0);
}
function hideCouponForm(){const b=el('coupon-form-box');if(b)b.style.display='none';}
function saveCoupon(){
  const editCode=el('cp-editcode')?.value||'';
  const code=(el('cp-code')?.value||'').trim().toUpperCase();
  const disc=Number(el('cp-disc')?.value||0);
  const type=el('cp-type')?.value||'percent';
  const desc=(el('cp-desc')?.value||'').trim();
  const active=el('cp-active')?.value==='true';
  if(!code){toast('Coupon code required','err');return;}
  if(!disc||disc<=0){toast('Discount value required','err');return;}
  if(!desc){toast('Description required','err');return;}
  if(!editCode){
    if(S.coupons.find(c=>c.code===code)){toast('Coupon code already exists','err');return;}
    S.coupons.push({code,disc,type,desc,active});
    toast('Coupon added ✅','ok');
  } else {
    const idx=S.coupons.findIndex(c=>c.code===editCode);
    if(idx>=0){S.coupons[idx]={code:editCode,disc,type,desc,active};toast('Coupon updated ✅','ok');}
  }
  hideCouponForm();render();
}
function delCoupon(code){
  if(!confirm('Delete coupon '+code+'?'))return;
  S.coupons=S.coupons.filter(c=>c.code!==code);
  if(S.couponApplied===code)S.couponApplied=null;
  toast('Coupon deleted','err');render();
}
function toggleCoupon(code){
  const cp=S.coupons.find(c=>c.code===code);
  if(!cp)return;
  cp.active=!cp.active;
  if(!cp.active&&S.couponApplied===code)S.couponApplied=null;
  toast(code+' '+(cp.active?'activated ✅':'deactivated'),'ok');
  render();
}
function saveSpecial(){
  S.special={enabled:el('sp-en')?.value==='true',name:el('sp-name')?.value||'',price:Number(el('sp-price')?.value)||0,desc:el('sp-desc')?.value||'',img:el('sp-img')?.value||''};

function saveAnn(){

function saveWifi(){

// ─── LOAD ALL DATA FROM FIRESTORE ─────────────────────────────────────────────
async function loadAllData() {
  try {
    // Menu
    const menuSnap = await getDocs(collection(db, 'menu'));
    if (!menuSnap.empty) {
      S.menu = menuSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      // First time: upload default menu to Firestore
      for (const item of S.menu) {
        await setDoc(doc(db, 'menu', String(item.id)), item);
      }
    }
    // Orders (real-time)
    onSnapshot(query(collection(db, 'orders'), orderBy('placedAt', 'desc')), snap => {
      S.orders = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      renderNavBadge(); renderBNav();
      if (S.page === 'admin' && S.adminTab === 'orders') render();
      if (S.page === 'admin' && S.adminTab === 'dashboard') render();
      if (S.page === 'status') render();
    });
    // Reservations (real-time)
    onSnapshot(query(collection(db, 'reservations'), orderBy('createdAt', 'desc')), snap => {
      S.reservations = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      if (S.page === 'admin' && S.adminTab === 'reservations') render();
    });
    // Coupons
    const cpSnap = await getDocs(collection(db, 'coupons'));
    if (!cpSnap.empty) {
      S.coupons = cpSnap.docs.map(d => ({ ...d.data(), code: d.id }));
    } else {
      for (const cp of S.coupons) {
        await setDoc(doc(db, 'coupons', cp.code), cp);
      }
    }
    // Offers
    const ofSnap = await getDocs(collection(db, 'offers'));
    if (!ofSnap.empty) S.offers = ofSnap.docs.map(d => ({ ...d.data(), id: d.id }));
    // Settings
    const stSnap = await getDoc(doc(db, 'settings', 'main'));
    if (stSnap.exists()) {
      const st = stSnap.data();
      if (st.special) S.special = st.special;
      if (st.announcement) S.announcement = st.announcement;
      if (st.wifi) S.wifi = st.wifi;
    }
  } catch(e) {
    console.error('Firestore load error:', e);
    toast('Data load error. Check Firestore rules.', 'err');
  }
}

// Save coupon
window.saveCoupon = async function() {
  const editCode = el('cp-editcode')?.value||'';
  const code = (el('cp-code')?.value||'').trim().toUpperCase();
  const disc = Number(el('cp-disc')?.value||0);
  const type = el('cp-type')?.value||'percent';
  const desc = (el('cp-desc')?.value||'').trim();
  const active = el('cp-active')?.value==='true';
  if(!code){toast('Coupon code required','err');return;}
  if(!disc||disc<=0){toast('Discount value required','err');return;}
  if(!desc){toast('Description required','err');return;}
  const cpData = {code,disc,type,desc,active};
  try {
    await setDoc(doc(db,'coupons',code), cpData);
    if(!editCode) {
      if(S.coupons.find(c=>c.code===code)){toast('Code already exists','err');return;}
      S.coupons.push(cpData);
      toast('Coupon added ✅','ok');
    } else {
      const idx=S.coupons.findIndex(c=>c.code===editCode);
      if(idx>=0) S.coupons[idx]=cpData;
      toast('Coupon updated ✅','ok');
    }
    hideCouponForm(); render();
  } catch(e){toast('Save failed: '+e.message,'err');}
};

  try {
    await deleteDoc(doc(db,'coupons',code));

  if(!cp) return;
  cp.active = !cp.active;
  try {
    await updateDoc(doc(db,'coupons',code),{active:cp.active});
    if(!cp.active && S.couponApplied===code) S.couponApplied=null;

// Save order
const _origSubmitOrder = window.submitOrder;
window.submitOrder = async function() {
  const name=(el('oname')?.value||'').trim();
  const phone=(el('ophone')?.value||'').trim();
  const otype=el('otype')?.value||'dine-in';
  const notes=(el('onotes')?.value||'').trim();
  if(!name){toast('Please enter your name','err');return;}
  if(!/^\d{10}$/.test(phone)){toast('Enter valid 10-digit phone','err');return;}
  let disc=0;
  if(S.couponApplied){const cp=getCouponMap()[S.couponApplied];const sub=cartSub();disc=cp.type==='percent'?Math.round(sub*cp.disc/100):Math.min(cp.disc,sub);}
  const sub=cartSub();const discSub=sub-disc;
  const oid='ORD'+Date.now().toString().slice(-6);
  const now=Date.now();
  const ord={id:oid,items:[...S.cart],total:discSub,subtotal:sub,discount:disc,coupon:S.couponApplied||'',customer:{name,phone,type:otype,notes},status:'Pending',at:new Date(now).toLocaleString('en-IN'),placedAt:now};
  try {
    await setDoc(doc(db,'orders',oid), ord);
    S.orders.unshift(ord); S.pendOrd=ord; S.curOid=oid;
    S.cart=[]; S.couponApplied=null; S.couponCode='';
    renderNavBadge(); go('payment');
  } catch(e) {
    // fallback: save locally
    S.orders.unshift(ord); S.pendOrd=ord; S.curOid=oid;
    S.cart=[]; S.couponApplied=null; S.couponCode='';
    renderNavBadge(); go('payment');
  }
};

import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const VAPID_KEY = 'BDSPX-GH2u33h4Kn8s4ZuMF4t7ygHxYlXDq2Fh54FJz4VkTyFu8OI4G_9YBBy-FBLJ8SQnsGIhuz_gPIsdRPPc0';
let messaging = null;

try { messaging = getMessaging(app); } catch(e) { console.log('Messaging init:', e.message); }

// Register Service Worker
async function registerSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    return reg;
  } catch(e) {
    console.log('SW register failed:', e);
    return null;
  }
}

// Request permission and get token
async function requestNotificationPermission() {
  if (!messaging) return;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      toast('Notification permission denied', 'err');
      return;
    }
    const swReg = await registerSW();
    const token = await getToken(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: swReg
    });
    if (token) {
      // Save token to Firestore
      const { setDoc, doc } = window.FB;
      await setDoc(doc(db, 'fcm_tokens', token), {
        token,
        role: S.adminIn ? 'admin' : 'customer',
        createdAt: Date.now()
      });
      toast('Notifications enabled! 🔔', 'ok');
      localStorage.setItem('fcm_token', token);
    }
  } catch(e) {
    console.log('Token error:', e);
  }
}

// Handle foreground messages
if (messaging) {
  onMessage(messaging, (payload) => {
    const { title, body } = payload.notification || {};
    if (title) {
      // Show in-app notification
      const d = document.createElement('div');
      d.className = 'push-notif';
      d.innerHTML = `<div class="pn-icon">🔔</div><div><div class="pn-title">${title}</div><div class="pn-body">${body||''}</div></div><button onclick="this.parentElement.remove()">✕</button>`;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 6000);
    }
  });
}

// Show notification bell in admin panel
window.showNotifBell = async function() {
  const snap = await getDocs(query(collection(db,'notifications'), orderBy('createdAt','desc')));
  const notifs = snap.docs.map(d=>({...d.data(),id:d.id})).filter(n=>!n.read).slice(0,10);
  const count = notifs.length;
  const bell = document.getElementById('notif-bell');
  if (bell) {
    bell.innerHTML = `🔔${count>0?`<span class="nbadge">${count}</span>`:''}`;
    bell.onclick = () => showNotifPanel(notifs);
  }
};

function showNotifPanel(notifs) {
  const existing = document.getElementById('notif-panel');
  if (existing) { existing.remove(); return; }
  const panel = document.createElement('div');
  panel.id = 'notif-panel';
  panel.className = 'notif-panel';
  panel.innerHTML = `
    <div class="np-head"><span>🔔 Notifications</span><button onclick="document.getElementById('notif-panel').remove()">✕</button></div>
    ${notifs.length === 0
      ? '<div class="np-empty">No new notifications</div>'
      : notifs.map(n=>`
        <div class="np-item" onclick="markNotifRead('${n.id}');if(n.orderId)go('admin');S.adminTab='orders';render()">
          <div class="np-title">${n.title}</div>
          <div class="np-body">${n.body}</div>
          <div class="np-time">${new Date(n.createdAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>`).join('')}
    <div style="padding:10px;text-align:center">
      <button onclick="markAllNotifsRead()" style="background:none;border:none;color:var(--or);font-size:.82rem;cursor:pointer;font-family:'Outfit',sans-serif">Mark all as read</button>
    </div>`;
  document.body.appendChild(panel);
}

window.markNotifRead = async function(id) {
  try { await updateDoc(doc(db,'notifications',id),{read:true}); } catch(e){}
};

window.markAllNotifsRead = async function() {
  const snap = await getDocs(collection(db,'notifications'));
  snap.docs.forEach(async d => {
    if (!d.data().read) await updateDoc(doc(db,'notifications',d.id),{read:true});
  });
  document.getElementById('notif-panel')?.remove();
  toast('All notifications cleared','ok');
};

// Poll notifications every 30s when admin is logged in
